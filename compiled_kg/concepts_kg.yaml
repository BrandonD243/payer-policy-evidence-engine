    positive_indicators:
    - spinal infection
    - epidural abscess
    - osteomyelitis
    - discitis
    type: atomic
  spinal_malignancy:
    category: malignancy
    definition: Cancer involving the spine or spinal cord.
    positive_indicators:
    - spinal malignancy
    - spinal cancer
    - malignant spinal tumor
    type: atomic
  spinal_stenosis:
