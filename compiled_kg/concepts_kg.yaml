  conservative_therapy_4_weeks:
    category: treatment_history
    definition: At least four weeks of conservative therapy.
    duration_indicators:
    - four weeks
    - 4 weeks
    - one month
    type: atomic
  conservative_therapy_6_weeks:
    category: treatment_history
    definition: At least six weeks of conservative, non-operative therapy.
    duration_indicators:
    - six weeks
    - 6 weeks
    - more than one month
    therapy_indicators:
    - physical therapy
    - NSAIDs
    - NSAID therapy
    - analgesics
    - muscle relaxants
    type: atomic
  decreased_reflexes:
    category: neurologic_finding
    definition: Reduced deep tendon reflexes.
    positive_indicators:
    - decreased reflexes
    - hyporeflexia
