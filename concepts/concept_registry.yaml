version: 1.0
description: >
  Canonical medical concept registry for CPT 72148 (MRI Lumbar Spine).
  Concepts are policy-aligned and used for semantic extraction and confidence scoring.

concepts:

  spinal_stenosis:
    type: atomic
    category: diagnosis
    definition: Narrowing of the spinal canal resulting in neural compression.
    positive_indicators:
      - spinal stenosis
      - narrowing of the spinal canal
      - reduced canal diameter
      - central canal narrowing
      - constricted spinal canal
    supporting_findings:
      - nerve root compression
      - neurogenic claudication
    negation_phrases:
      - no spinal stenosis
      - canal widely patent
    certainty_signals:
      confirmed:
        - diagnosed with
        - imaging shows
        - MRI demonstrates
      suspected:
        - concerning for
        - possible
        - may represent

  spinal_cord_compression:
    type: atomic
    category: neurologic_condition
    definition: Compression of the spinal cord causing neurologic compromise.
    positive_indicators:
      - spinal cord compression
      - cord compression
      - compression of the spinal cord
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - confirmed
        - evident on imaging

  cauda_equina_syndrome:
    type: atomic
    category: neurologic_emergency
    definition: Compression of the cauda equina nerve roots.
    positive_indicators:
      - cauda equina syndrome
      - compression of cauda equina
    supporting_findings:
      - saddle anesthesia
      - bowel or bladder dysfunction
      - bilateral lower extremity weakness
      - bilateral lower extremity numbness
      - difficulty walking or standing due to weakness
      - inability to rise from chair
      - lower extremity motor deficit
      - lower extremity sensory deficit
    derived_from:
      - motor_weakness
      - sensory_deficit
      - bilateral_lower_extremity_symptoms

  congenital_spinal_anomaly:
    type: atomic
    category: congenital
    definition: Congenital structural abnormality of the spine.
    positive_indicators:
      - congenital spinal anomaly
      - congenital deformity
      - spinal dysraphism
      - scoliosis since birth

  epidural_lipomatosis:
    type: atomic
    category: diagnosis
    definition: Excessive fat deposition in the epidural space.
    positive_indicators:
      - epidural lipomatosis
      - fatty overgrowth in epidural space

  prior_spinal_surgery:
    type: atomic
    category: surgical_history
    definition: History of prior operative intervention on the spine.
    positive_indicators:
      - prior spinal surgery
      - status post spinal surgery
      - s/p laminectomy
      - spinal fusion

  recurrent_spinal_symptoms:
    type: atomic
    category: symptom
    definition: Return or persistence of spinal symptoms after prior surgery.
    positive_indicators:
      - recurrent pain
      - return of symptoms
      - worsening after surgery

  planned_epidural_injection:
    type: atomic
    category: procedural_planning
    definition: Planned epidural steroid or anesthetic injection.
    positive_indicators:
      - planned epidural injection
      - epidural steroid injection planned
      - ESI planned

  spinal_malignancy:
    type: atomic
    category: malignancy
    definition: Cancer involving the spine or spinal cord.
    positive_indicators:
      - spinal malignancy
      - spinal cancer
      - malignant spinal tumor

  spinal_infection:
    type: atomic
    category: infection
    definition: Infectious process involving the spine or surrounding tissues.
    positive_indicators:
      - spinal infection
      - epidural abscess
      - osteomyelitis
      - discitis
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - diagnosed
        - culture proven

  myelopathy:
    type: atomic
    category: neurologic_condition
    definition: Dysfunction of the spinal cord.
    positive_indicators:
      - myelopathy
      - spinal cord dysfunction
      - upper motor neuron signs

  spinal_cord_tumor:
    type: atomic
    category: malignancy
    definition: Primary tumor of the spinal cord.
    positive_indicators:
      - spinal cord tumor
      - intramedullary tumor

  radiculopathy:
    type: atomic
    category: neurologic_symptom
    definition: Pain or neurologic symptoms radiating along a nerve root.
    positive_indicators:
      - radiculopathy
      - lumbar radiculopathy
      - radicular pain
      - sciatica
      - nerve root pain
      - radiating down the leg
      - radiating down right leg
      - radiating down left leg
      - pain radiating down the leg
      - pain radiating to the leg
      - pain radiates down the leg
      - shooting pain down the leg
      - dermatomal pain
      - dermatomal numbness
      - numbness and tingling down the leg
      - tingling down the leg

    supporting_findings:
      - positive straight leg raise
      - SLR positive
      - straight leg raise positive
      - dermatomal numbness
      - dermatomal weakness

  objective_neurologic_deficit:
    type: derived
    category: neurologic_finding
    logic: any_of
    definition: Objective abnormalities on neurologic examination.
    positive_indicators:
      - decreased reflexes
      - motor weakness
      - sensory deficit
      - abnormal neurologic exam
    derived_from:
      - motor_weakness
      - sensory_deficit
      - decreased_reflexes
      - cauda_equina_syndrome
    negation_patterns:
     - strength 5/5
     - reflexes intact
     - sensation intact

  decreased_reflexes:
    type: atomic
    category: neurologic_finding
    definition: Reduced deep tendon reflexes.
    positive_indicators:
      - decreased reflexes
      - hyporeflexia

  motor_weakness:
    type: atomic
    category: neurologic_finding
    definition: Decreased muscle strength.
    positive_indicators:
      - weakness
      - motor weakness
      - decreased strength
      - reduced strength
      - weakness noted
      - difficulty standing due to weakness
      - unable to stand
      - difficulty walking
    strength_scale_indicators:
      - 4/5
      - 3/5
      - 2/5
      - 1/5
    negation_patterns:
      - 5/5 strength
      - normal strength
      - full strength
      - strength intact
    certainty_signals:
      confirmed:
        - diagnosed with
        - evident on exam
      suspected:
        - concerning for
        - possible


  sensory_deficit:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - decreased sensation
      - numbness
      - sensory loss
      - L4 distribution
      - L5 distribution
      - S1 distribution
      - bilateral lower extremity numbness

  symptoms_over_6_weeks:
    type: atomic
    category: symptom_duration
    definition: Symptoms present longer than six weeks.
    positive_indicators:
      - chronic low back pain
      - longstanding pain
      - several years of pain
      - persistent pain for months
    duration_indicators:
      - more than six weeks
      - more than 6 weeks
      - over six weeks
      - over 6 weeks
      - greater than six weeks
      - greater than 6 weeks
      - six week history
      - 6 week history
      - two month history
      - 2 month history
      - three month history
      - 3 month history
      - four month history
      - 4 month history
      - greater than 4 months
      - more than 4 months
      - several months
      - chronic
      - persistent for months
      - "> 6 weeks"
      - ">6 weeks"
      - "> 2 months"
      - ">2 months"
      - "> 4 months"
      - ">4 months"

  symptoms_under_6_weeks:
    type: atomic
    category: symptom_duration
    duration_indicators:
      - 1 week
      - 2 week
      - 3 week
      - 4 week
      - 5 week
      - 1 week history
      - 2 week history
      - 3 week history
      - 4 week history
      - 5 week history
      - 1 week hx
      - 2 week hx
      - 3 week hx
      - 4 week hx
      - 5 week hx
      - symptoms for several weeks
      - symptoms for a few weeks

  acute_low_back_pain:
    type: derived
    category: condition
    logic: all_of
    definition: Low back pain present for less than six weeks.
    derived_from:
      - low_back_pain
      - symptoms_under_6_weeks


  osteoporosis_risk:
    type: atomic
    category: risk_factor
    definition: Risk factors for osteoporotic fracture.
    positive_indicators:
      - osteoporosis
      - osteopenia
      - chronic steroid use
      - fragility fracture history
      - low bone density
      - elderly patient

  no_red_flags:
    type: derived
    category: policy_state
    logic: all_of
    derived_from:
      - normal_neurologic_exam

  red_flag:
    type: derived
    category: policy_state
    definition: Clinical features that override acute low back pain exclusion.
    derived_from:
      - cauda_equina_syndrome
      - major_trauma
      - objective_neurologic_deficit

  major_trauma:
    type: atomic
    category: clinical_history
    definition: Significant traumatic event with risk of fracture or severe injury.
    positive_indicators:
      - high-speed motor vehicle collision
      - highway speed collision
      - motor vehicle accident at highway speed
      - hit from behind at high speed
      - rear-ended at highway speed
      - major trauma
      - fall from height >6 feet
      - pedestrian hit by vehicle
      - trauma resulting in severe pain
    supporting_findings:
      - mechanism of injury significant for fracture
    derived_from:
      - trauma

  conservative_therapy_failed:
    type: atomic
    category: treatment_response
    definition: Symptoms persist despite conservative therapy.
    positive_indicators:
      - failed conservative management
      - conservative therapy failed
      - symptoms persisted despite therapy
      - persistent symptoms despite therapy
      - minimal improvement with therapy
      - no improvement with therapy
      - refractory to conservative treatment
      - symptoms not improving with therapy
      - limited relief
      - inadequate response

  progressive_symptoms:
    type: atomic
    category: symptom_progression
    definition: Symptoms worsening over time.
    positive_indicators:
      - progressive pain
      - progressive symptoms
      - worsening pain
      - worsening symptoms
      - progressively worsening
      - increasing pain
      - symptoms worsening
    negation_phrases:
      - persistent symptoms
      - unchanged symptoms
      - stable symptoms
      - duration only
    certainty_signals:
      confirmed:
      - worsening
      - increasing
      suspected:
      - progressive

  chronic_mechanical_low_back_pain:
    type: derived
    category: diagnosis
    derived_from:
      - chronic_low_back_pain
      - normal_neurologic_exam
      - no_red_flags

  chronic_low_back_pain:
    type: atomic
    category: symptom_duration
    positive_indicators:
      - chronic low back pain
      - longstanding low back pain
      - pain for several months
      - pain for years
    derived_from:
      - low_back_pain
      - symptoms_over_6_weeks

  normal_neurologic_exam:
    type: atomic
    category: exam
    positive_indicators:
      - neurologic exam normal
      - reflexes intact
      - strength 5/5
      - sensation intact

  normal_strength:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - strength 5/5
      - motor strength 5/5

  bilateral_lower_extremity_symptoms:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - bilateral leg weakness
      - bilateral leg numbness
      - bilateral lower extremity weakness
      - bilateral lower extremity numbness

  trauma:
    type: atomic
    category: clinical_history
    positive_indicators:
      - motor vehicle collision
      - car accident
      - MVC
      - fall
      - traumatic injury

  rapid_neurologic_decline:
    type: atomic
    category: neurologic_emergency
    positive_indicators:
      - rapidly worsening weakness
      - rapid neurologic deterioration
      - sudden neurologic decline

  low_back_pain:
    type: atomic
    category: symptom
    positive_indicators:
      - low back pain
      - lumbar pain
      - lumbar back pain
      - pain in lower back
      - lumbago

  lumbar_spine_imaging_requested:
    type: atomic
    category: ordering_context
    positive_indicators:
      - MRI lumbar spine requested
      - MRI lumbar spine ordered
      - lumbar spine MRI ordered
      - MRI of lumbar spine requested

  positive_straight_leg_raise:
    type: atomic
    category: neurologic_test
    positive_indicators:
      - straight leg raise positive
      - positive straight leg raise
      - slr positive
      - positive slr
      - mildly positive straight leg raise
      - slr mildly positive
      - straight leg raise mildly positive
      
  occipital_neuralgia:
    type: atomic
    category: diagnosis
    definition: Neuralgia involving the greater or lesser occipital nerves
    positive_indicators:
      - occipital neuralgia
      - greater occipital neuralgia
      - occipital nerve pain


  nerve_block_trial:
    type: atomic
    category: procedure
    definition: Diagnostic occipital nerve block performed
    positive_indicators:
      - occipital nerve block
      - diagnostic nerve block
      - greater occipital nerve block
      - gon block


  temporary_relief:
    type: atomic
    category: outcome
    definition: Temporary improvement in symptoms after intervention
    positive_indicators:
      - temporary relief
      - short term relief
      - transient relief
      - relief lasting hours
      - relief lasting days


  relief_not_sustained:
    type: atomic
    category: outcome
    definition: Relief from intervention was temporary and symptoms returned
    positive_indicators:
      - pain returned
      - relief wore off
      - symptoms returned
      - relief not sustained
      - temporary improvement only
      - returned to baseline
      - returned to baseline levels