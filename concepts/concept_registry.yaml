version: 1.0
description: >
  Canonical medical concept registry for CPT 72148 (MRI Lumbar Spine).
  Concepts are policy-aligned and used for semantic extraction and confidence scoring.

concepts:

  spinal_stenosis:
    type: atomic
    category: diagnosis
    definition: Narrowing of the spinal canal resulting in neural compression.
    positive_indicators:
      - spinal stenosis
      - narrowing of the spinal canal
      - reduced canal diameter
      - central canal narrowing
      - constricted spinal canal
    supporting_findings:
      - nerve root compression
      - neurogenic claudication
    negation_phrases:
      - no spinal stenosis
      - canal widely patent
    certainty_signals:
      confirmed:
        - diagnosed with
        - imaging shows
        - MRI demonstrates
      suspected:
        - concerning for
        - possible
        - may represent

  spinal_cord_compression:
    type: atomic
    category: neurologic_condition
    definition: Compression of the spinal cord causing neurologic compromise.
    positive_indicators:
      - spinal cord compression
      - cord compression
      - compression of the spinal cord
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - confirmed
        - evident on imaging

  cauda_equina_syndrome:
    type: derived
    category: neurologic_emergency
    logic: any_of
    definition: Compression of the cauda equina nerve roots causing bowel, bladder, or saddle sensory dysfunction.
    positive_indicators:
      - cauda equina syndrome
      - compression of cauda equina
    derived_from:
      - saddle_anesthesia
      - bowel_dysfunction
      - bladder_dysfunction
      - urinary_retention
    supporting_findings:
      - bilateral_lower_extremity_symptoms
      - motor_weakness_major

  congenital_spinal_anomaly:
    type: atomic
    category: congenital
    definition: Congenital structural abnormality of the spine.
    positive_indicators:
      - congenital spinal anomaly
      - congenital deformity
      - spinal dysraphism
      - scoliosis since birth

  epidural_lipomatosis:
    type: atomic
    category: diagnosis
    definition: Excessive fat deposition in the epidural space.
    positive_indicators:
      - epidural lipomatosis
      - fatty overgrowth in epidural space

  prior_spinal_surgery:
    type: atomic
    category: surgical_history
    definition: History of prior operative intervention on the spine.
    positive_indicators:
      - prior spinal surgery
      - status post spinal surgery
      - s/p laminectomy
      - spinal fusion

  recurrent_spinal_symptoms:
    type: atomic
    category: symptom
    definition: Return or persistence of spinal symptoms after prior surgery.
    positive_indicators:
      - recurrent pain
      - return of symptoms
      - worsening after surgery

  planned_epidural_injection:
    type: atomic
    category: procedural_planning
    definition: Planned epidural steroid or anesthetic injection.
    positive_indicators:
      - planned epidural injection
      - epidural steroid injection planned
      - ESI planned

  spinal_malignancy:
    type: atomic
    category: malignancy
    definition: Cancer involving the spine or spinal cord.
    positive_indicators:
      - spinal malignancy
      - spinal cancer
      - malignant spinal tumor

  cancer_history:
    type: atomic
    category: risk_factor
    definition: History of cancer that may involve the spine.
    positive_indicators:
      - history of cancer
      - prior cancer
      - prostate cancer
      - breast cancer
      - lung cancer
      - metastatic disease
      - cancer history

  spinal_malignancy_risk:
    type: derived
    category: malignancy
    logic: any_of
    definition: Risk factors for spinal malignancy requiring imaging.
    derived_from:
      - spinal_malignancy
      - cancer_history

  malignancy_imaging_indication:
    type: derived
    category: imaging_indication
    logic: any_of
    definition: Clinical indication for imaging due to cancer risk
    derived_from:
      - spinal_malignancy
      - cancer_history
      - spinal_malignancy_risk

  spinal_infection:
    type: atomic
    category: infection
    definition: Infectious process involving the spine or surrounding tissues.
    positive_indicators:
      - spinal infection
      - epidural abscess
      - osteomyelitis
      - discitis
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - diagnosed
        - culture proven

  myelopathy:
    type: atomic
    category: neurologic_condition
    definition: Dysfunction of the spinal cord.
    positive_indicators:
      - myelopathy
      - spinal cord dysfunction
      - upper motor neuron signs

  spinal_cord_tumor:
    type: atomic
    category: malignancy
    definition: Primary tumor of the spinal cord.
    positive_indicators:
      - spinal cord tumor
      - intramedullary tumor

  radiculopathy:
    type: atomic
    category: neurologic_symptom
    definition: Pain or neurologic symptoms radiating along a nerve root.
    positive_indicators:
      - radiculopathy
      - lumbar radiculopathy
      - radicular pain
      - sciatica
      - nerve root pain
      - radiating down the leg
      - radiating down right leg
      - radiating down left leg
      - pain radiating down the leg
      - pain radiating to the leg
      - pain radiates down the leg
      - shooting pain down the leg
      - dermatomal pain
      - dermatomal numbness
      - numbness and tingling down the leg
      - tingling down the leg

    supporting_findings:
      - positive straight leg raise
      - SLR positive
      - straight leg raise positive
      - dermatomal numbness
      - dermatomal weakness

  radiculopathy_with_deficit:
    type: derived
    category: neurologic_condition
    logic: all_of
    definition: Radiculopathy with objective neurologic deficit on exam.
    derived_from:
      - radiculopathy
      - objective_neurologic_deficit

  objective_neurologic_deficit:
    type: derived
    category: neurologic_finding
    logic: any_of
    definition: Objective abnormalities on neurologic examination.
    positive_indicators:
      - decreased reflexes
      - motor weakness
      - sensory deficit
      - abnormal neurologic exam
    derived_from:
      - motor_weakness
      - sensory_deficit
      - decreased_reflexes
      - cauda_equina_syndrome
    negation_patterns:
     - strength 5/5
     - reflexes intact
     - sensation intact

  decreased_reflexes:
    type: atomic
    category: neurologic_finding
    definition: Reduced deep tendon reflexes.
    positive_indicators:
      - decreased reflexes
      - hyporeflexia

  motor_weakness:
    type: atomic
    category: neurologic_finding
    definition: Decreased muscle strength.
    positive_indicators:
      - weakness
      - motor weakness
      - decreased strength
      - reduced strength
      - weakness noted
      - difficulty standing due to weakness
      - unable to stand
      - difficulty walking
    negation_patterns:
      - 5/5 strength
      - normal strength
      - full strength
      - strength intact
    certainty_signals:
      confirmed:
        - diagnosed with
        - evident on exam
      suspected:
        - concerning for
        - possible

  motor_weakness_major:
    type: atomic
    category: neurologic_finding
    definition: Major motor weakness consistent with significant neurologic deficit.
    positive_indicators:
      - 3/5 strength
      - strength 3/5
      - motor strength 3/5
      - 3/5 motor strength
      - 2/5 strength
      - 1/5 strength
      - significant motor deficit
      - profound motor weakness
      - severe motor weakness
      - severe weakness
      - major motor weakness
    negation_patterns:
      - 4/5 strength
      - mild weakness
      - slight weakness
      - minor weakness
      - near normal strength
    certainty_signals:
      confirmed:
        - severe motor weakness
        - profound motor weakness
      suspected:
        - concerning for major motor weakness
        - possible major motor weakness

  motor_weakness_mild:
    type: atomic
    category: neurologic_finding
    definition: Mild motor weakness not meeting major deficit criteria.
    positive_indicators:
      - 4/5 strength
      - mild weakness
      - slight weakness
      - minor weakness
      - mild motor weakness
    negation_patterns:
      - 5/5 strength
      - normal strength
      - full strength
      - strength intact
    certainty_signals:
      confirmed:
        - mild weakness
      suspected:
        - possible mild weakness


  sensory_deficit:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - decreased sensation
      - numbness
      - sensory loss
      - L4 distribution
      - L5 distribution
      - S1 distribution
      - bilateral lower extremity numbness

  saddle_anesthesia:
    type: atomic
    category: neurologic_finding
    definition: Loss of sensation in the perineal area (saddle distribution).
    positive_indicators:
      - saddle anesthesia
      - perineal anesthesia
      - saddle numbness
      - loss of sensation in saddle area
      - anesthesia in perineum
    negation_patterns:
      - sensation intact in saddle area
      - no saddle anesthesia

  bowel_dysfunction:
    type: atomic
    category: neurologic_finding
    definition: Abnormal bowel function suggestive of neurologic compromise.
    positive_indicators:
      - bowel incontinence
      - fecal incontinence
      - constipation
      - difficulty with bowel movements
      - inability to control bowels
      - bowel dysfunction
    negation_patterns:
      - normal bowel function
      - bowel habits normal

  bladder_dysfunction:
    type: atomic
    category: neurologic_finding
    definition: Abnormal bladder function suggestive of neurologic compromise.
    positive_indicators:
      - urinary incontinence
      - bladder incontinence
      - difficulty urinating
      - urinary retention
      - inability to void
      - bladder dysfunction
    negation_patterns:
      - normal bladder function
      - voiding normal

  urinary_retention:
    type: atomic
    category: neurologic_finding
    definition: Inability to empty the bladder.
    positive_indicators:
      - urinary retention
      - unable to urinate
      - retention of urine
      - bladder not emptying
    negation_patterns:
      - normal voiding
      - able to urinate normally

  symptoms_acute:
    type: atomic
    category: symptom_duration
    definition: Symptoms present for less than 6 weeks.
    positive_indicators:
      - symptoms under 6 weeks
      - acute onset
      - recent onset

  symptoms_subacute:
    type: atomic
    category: symptom_duration
    definition: Symptoms present for 6-12 weeks.
    positive_indicators:
      - 6-12 weeks
      - subacute

  symptoms_chronic:
    type: atomic
    category: symptom_duration
    definition: Symptoms present for more than 6 weeks.
    positive_indicators:
      - more than 6 weeks
      - months
      - years
      - chronic
      - longstanding
      - persistent

  duration_numeric_over_6_weeks:
    type: atomic
    category: symptom_duration
    definition: Explicit or inferred symptom duration greater than 6 weeks
    positive_indicators:
      - 2 months
      - 3 months
      - 4 months
      - 5 months
      - 6 months
      - several months
      - months of symptoms
      - years of symptoms
      - approx 5 months
      - 5 months
      - 6 months history
      - chronic pain for months
      - longstanding pain for months

  symptoms_over_6_weeks:
    type: derived
    category: symptom_duration
    logic: any_of
    definition: Symptoms present longer than six weeks.
    derived_from:
      - symptoms_chronic
      - duration_numeric_over_6_weeks

  symptoms_under_6_weeks:
    type: atomic
    category: symptom_duration
    duration_indicators:
      - 1 week
      - 2 week
      - 3 week
      - 4 week
      - 5 week
      - 1 week history
      - 2 week history
      - 3 week history
      - 4 week history
      - 5 week history
      - 1 week hx
      - 2 week hx
      - 3 week hx
      - 4 week hx
      - 5 week hx
      - symptoms for several weeks
      - symptoms for a few weeks

  acute_low_back_pain_episode:
    type: atomic
    category: policy_state
    definition: Clinically acute low back pain episode (<6 weeks).
    positive_indicators:
      - symptoms under 6 weeks
      - acute onset back pain
      - acute low back pain

  absence_of_red_flags:
    type: atomic
    category: policy_state
    definition: Absence of red flag findings on clinical evaluation.
    positive_indicators:
      - normal neuro exam
      - no weakness
      - no bowel or bladder symptoms
      - no saddle anesthesia
      - no urinary retention
      - no fecal incontinence

  no_red_flag_finding:
    type: derived
    category: policy_state
    logic: none_of
    definition: Explicit absence of red flag conditions
    derived_from:
      - cauda_equina_syndrome
      - spinal_malignancy
      - spinal_infection
      - motor_weakness_major
      - progressive_neurologic_symptoms

  no_red_flags:
    type: derived
    category: policy_state
    logic: all_of
    definition: No red flag findings present.
    derived_from:
      - normal_neurologic_exam
      - no_red_flag_finding

  osteoporosis_risk:
    type: atomic
    category: risk_factor
    definition: Risk factors for osteoporotic fracture.
    positive_indicators:
      - osteoporosis
      - osteopenia
      - chronic steroid use
      - fragility fracture history
      - low bone density
      - elderly patient

  red_flag_finding:
    type: derived
    category: neurologic_emergency
    logic: any_of
    definition: Clinical features that override acute low back pain exclusion.
    derived_from:
      - cauda_equina_syndrome
      - spinal_malignancy
      - spinal_infection
      - major_motor_weakness
      - progressive_neurologic_symptoms

  neurologic_red_flag:
    type: derived
    category: neurologic_emergency
    logic: any_of
    definition: Neurologic findings that require urgent evaluation.
    derived_from:
      - motor_weakness_major
      - cauda_equina_syndrome
      - rapid_neurologic_decline

  traumatic_neurologic_deficit:
    type: derived
    category: neurologic_emergency
    logic: all_of
    definition: Trauma with neurologic deficit.
    derived_from:
      - trauma
      - objective_neurologic_deficit

  major_trauma:
    type: atomic
    category: clinical_history
    definition: Significant traumatic event with risk of fracture or severe injury.
    positive_indicators:
      - high-speed motor vehicle collision
      - highway speed collision
      - motor vehicle accident
      - motor vehicle accident at highway speed
      - mvc
      - hit from behind at high speed
      - rear-ended at highway speed
      - rear ended at highway speed
      - rear ended
      - rear-ended
      - restrained driver
      - major trauma
      - fall from height >6 feet
      - pedestrian hit by vehicle
      - trauma resulting in severe pain
    supporting_findings:
      - mechanism of injury significant for fracture

  possible_spinal_fracture:
    type: derived
    category: clinical_risk
    definition: Trauma mechanism with risk for vertebral fracture.
    logic: any_of
    positive_indicators:
      - possible spinal fracture
      - fracture suspected
      - suspected fracture
    derived_from:
      - major_trauma
      - trauma

  conservative_therapy_failed:
    type: atomic
    category: treatment_response
    definition: Symptoms persist despite conservative therapy.
    positive_indicators:
      - failed conservative management
      - conservative therapy failed
      - symptoms persisted despite therapy
      - persistent symptoms despite therapy
      - minimal improvement with therapy
      - no improvement with therapy
      - refractory to conservative treatment
      - symptoms not improving with therapy
      - limited relief
      - inadequate response

  progressive_neurologic_symptoms:
    type: atomic
    category: neurologic_progression
    definition: Worsening neurologic function or persistent symptoms despite treatment.
    positive_indicators:
      - progressive weakness
      - increasing weakness
      - worsening motor weakness
      - new onset weakness
      - spreading sensory deficit
      - worsening numbness
      - deteriorating neurologic exam findings
      - increasing difficulty walking
      - progressive neurologic deficit
      - worsening neurologic deficit
      - progressive symptoms despite therapy
      - persistent symptoms despite treatment
      - functional worsening
      - progression of radicular pain
      - failure to improve with therapy
      - worsening despite conservative management
    negation_patterns:
      - pain only
      - stable neurologic exam
      - unchanged symptoms
      - stable symptoms

  chronic_mechanical_low_back_pain:
    type: derived
    category: diagnosis
    derived_from:
      - chronic_low_back_pain
      - normal_neurologic_exam
      - no_red_flags

  chronic_low_back_pain:
    type: atomic
    category: symptom_duration
    positive_indicators:
      - chronic low back pain
      - longstanding low back pain
      - pain for several months
      - pain for years
    derived_from:
      - low_back_pain
      - symptoms_over_6_weeks

  persistent_radiculopathy:
    type: derived
    category: imaging_indication
    logic: all_of
    definition: Radiculopathy persisting longer than six weeks.
    derived_from:
      - radiculopathy
      - symptoms_over_6_weeks

  persistent_radiculopathy_despite_therapy:
    type: derived
    category: imaging_indication
    logic: all_of
    definition: Radiculopathy persisting despite conservative therapy.
    derived_from:
      - radiculopathy
      - symptoms_over_6_weeks
      - conservative_therapy_failed

  failed_conservative_therapy_with_neuro_symptoms:
    type: derived
    category: imaging_indication
    logic: all_of
    definition: Persistent neurologic symptoms despite conservative therapy
    derived_from:
      - radiculopathy
      - conservative_therapy_failed

  normal_neurologic_exam:
    type: atomic
    category: exam
    positive_indicators:
      - neurologic exam normal
      - reflexes intact
      - strength 5/5
      - sensation intact

  normal_strength:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - strength 5/5
      - motor strength 5/5

  bilateral_lower_extremity_symptoms:
    type: atomic
    category: neurologic_finding
    positive_indicators:
      - bilateral leg weakness
      - bilateral leg numbness
      - bilateral lower extremity weakness
      - bilateral lower extremity numbness

  trauma:
    type: atomic
    category: clinical_history
    positive_indicators:
      - motor vehicle collision
      - car accident
      - MVC
      - fall
      - traumatic injury

  minor_trauma:
    type: atomic
    category: clinical_history
    definition: Trauma that is low-energy or unlikely to produce major fracture.
    positive_indicators:
      - minor fall
      - fall from standing
      - lifting injury
      - twisting injury
      - low energy fall
      - ground-level fall
      - slip and fall
      - stumble
      - simple fall

  rapid_neurologic_decline:
    type: atomic
    category: neurologic_emergency
    positive_indicators:
      - rapidly worsening weakness
      - rapid neurologic deterioration
      - sudden neurologic decline

  low_back_pain:
    type: atomic
    category: symptom
    positive_indicators:
      - low back pain
      - lumbar pain
      - lumbar back pain
      - pain in lower back
      - lumbago

  lumbar_spine_imaging_requested:
    type: atomic
    category: ordering_context
    positive_indicators:
      - MRI lumbar spine requested
      - MRI lumbar spine ordered
      - lumbar spine MRI ordered
      - MRI of lumbar spine requested

  positive_straight_leg_raise:
    type: atomic
    category: neurologic_test
    positive_indicators:
      - straight leg raise positive
      - positive straight leg raise
      - slr positive
      - positive slr
      - mildly positive straight leg raise
      - slr mildly positive
      - straight leg raise mildly positive
      
  occipital_neuralgia:
    type: atomic
    category: diagnosis
    definition: Neuralgia involving the greater or lesser occipital nerves
    positive_indicators:
      - occipital neuralgia
      - greater occipital neuralgia
      - occipital nerve pain


  nerve_block_trial:
    type: atomic
    category: procedure
    definition: Diagnostic occipital nerve block performed
    positive_indicators:
      - occipital nerve block
      - diagnostic nerve block
      - greater occipital nerve block
      - gon block


  temporary_relief:
    type: atomic
    category: outcome
    definition: Temporary improvement in symptoms after intervention
    positive_indicators:
      - temporary relief
      - short term relief
      - transient relief
      - relief lasting hours
      - relief lasting days


  relief_not_sustained:
    type: atomic
    category: outcome
    definition: Relief from intervention was temporary and symptoms returned
    positive_indicators:
      - pain returned
      - relief wore off
      - symptoms returned
      - relief not sustained
      - temporary improvement only
      - returned to baseline
      - returned to baseline levels

  acute_radiculopathy_with_exam_findings:
    type: derived
    category: imaging_indication
    logic: all_of
    definition: Acute radiculopathy with supportive neurologic exam findings.
    derived_from:
      - radiculopathy
      - symptoms_acute
      - positive_straight_leg_raise

  early_imaging_indicated:
    type: derived
    category: imaging_indication
    logic: any_of
    definition: Clinical scenarios where imaging is appropriate despite acute onset.
    derived_from:
      - acute_radiculopathy_with_exam_findings
      - traumatic_neurologic_deficit
      - neurologic_red_flag

  acute_imaging_exception_applies:
    type: derived
    category: policy_override
    logic: any_of
    definition: Exceptions that allow imaging for acute presentations.
    derived_from:
      - neurologic_red_flag
      - acute_radiculopathy_with_exam_findings

# =========================
# PAIN TAXONOMY
# =========================

  acute_pain:
    type: atomic
    category: pain
    definition: Short-term pain, typically post-procedural or injury-related.
    positive_indicators:
      - acute pain
      - post-operative pain
      - post surgical pain
      - immediate pain after surgery
      - acute onset pain


  chronic_pain:
    type: atomic
    category: pain
    definition: Persistent pain lasting longer than expected healing period.
    positive_indicators:
      - chronic pain
      - longstanding pain
      - persistent pain
      - pain for months
      - pain for years


  cancer_pain:
    type: atomic
    category: pain
    definition: Pain associated with malignancy.
    positive_indicators:
      - cancer pain
      - malignancy-related pain
      - tumor-related pain
      - pain due to cancer


  refractory_pain:
    type: atomic
    category: pain
    definition: Pain not responsive to standard treatments.
    positive_indicators:
      - refractory pain
      - intractable pain
      - pain not controlled
      - resistant pain


# =========================
