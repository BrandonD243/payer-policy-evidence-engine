version: 1.0
description: >
  Canonical medical concept registry for CPT 72148 (MRI Lumbar Spine).
  Concepts are policy-aligned and used for semantic extraction and confidence scoring.

concepts:

  spinal_stenosis:
    type: atomic
    category: diagnosis
    definition: Narrowing of the spinal canal resulting in neural compression.
    positive_indicators:
      - spinal stenosis
      - narrowing of the spinal canal
      - reduced canal diameter
      - central canal narrowing
      - constricted spinal canal
    supporting_findings:
      - nerve root compression
      - neurogenic claudication
    negation_phrases:
      - no spinal stenosis
      - canal widely patent
    certainty_signals:
      confirmed:
        - diagnosed with
        - imaging shows
        - MRI demonstrates
      suspected:
        - concerning for
        - possible
        - may represent

  spinal_cord_compression:
    type: atomic
    category: neurologic_condition
    definition: Compression of the spinal cord causing neurologic compromise.
    positive_indicators:
      - spinal cord compression
      - cord compression
      - compression of the spinal cord
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - confirmed
        - evident on imaging

  cauda_equina_syndrome:
    type: atomic
    category: neurologic_emergency
    definition: Compression of the cauda equina nerve roots.
    positive_indicators:
      - cauda equina syndrome
      - compression of cauda equina
    supporting_findings:
      - saddle anesthesia
      - bowel or bladder dysfunction

  congenital_spinal_anomaly:
    type: atomic
    category: congenital
    definition: Congenital structural abnormality of the spine.
    positive_indicators:
      - congenital spinal anomaly
      - congenital deformity
      - spinal dysraphism
      - scoliosis since birth

  epidural_lipomatosis:
    type: atomic
    category: diagnosis
    definition: Excessive fat deposition in the epidural space.
    positive_indicators:
      - epidural lipomatosis
      - fatty overgrowth in epidural space

  prior_spinal_surgery:
    type: atomic
    category: surgical_history
    definition: History of prior operative intervention on the spine.
    positive_indicators:
      - prior spinal surgery
      - status post spinal surgery
      - s/p laminectomy
      - spinal fusion

  recurrent_spinal_symptoms:
    type: atomic
    category: symptom
    definition: Return or persistence of spinal symptoms after prior surgery.
    positive_indicators:
      - recurrent pain
      - return of symptoms
      - worsening after surgery

  planned_epidural_injection:
    type: atomic
    category: procedural_planning
    definition: Planned epidural steroid or anesthetic injection.
    positive_indicators:
      - planned epidural injection
      - epidural steroid injection planned
      - ESI planned

  spinal_malignancy:
    type: atomic
    category: malignancy
    definition: Cancer involving the spine or spinal cord.
    positive_indicators:
      - spinal malignancy
      - spinal cancer
      - malignant spinal tumor

  spinal_infection:
    type: atomic
    category: infection
    definition: Infectious process involving the spine or surrounding tissues.
    positive_indicators:
      - spinal infection
      - epidural abscess
      - osteomyelitis
      - discitis
    certainty_signals:
      suspected:
        - suspected
        - concern for
      confirmed:
        - diagnosed
        - culture proven

  myelopathy:
    type: atomic
    category: neurologic_condition
    definition: Dysfunction of the spinal cord.
    positive_indicators:
      - myelopathy
      - spinal cord dysfunction
      - upper motor neuron signs

  spinal_cord_tumor:
    type: atomic
    category: malignancy
    definition: Primary tumor of the spinal cord.
    positive_indicators:
      - spinal cord tumor
      - intramedullary tumor

  radiculopathy:
    type: atomic
    category: neurologic_symptom
    definition: Pain or neurologic symptoms radiating along a nerve root.
    positive_indicators:
      - radiculopathy
      - radiating pain
      - nerve root pain
      - sciatica

  objective_neurologic_deficit:
    type: derived
    category: neurologic_finding
    definition: Objective abnormalities on neurologic examination.
    positive_indicators:
      - decreased reflexes
      - motor weakness
      - sensory deficit
      - abnormal neurologic exam
    derived_from:
      - motor_weakness
      - sensory_deficit
      - decreased_reflexes

  decreased_reflexes:
    type: atomic
    category: neurologic_finding
    definition: Reduced deep tendon reflexes.
    positive_indicators:
      - decreased reflexes
      - hyporeflexia

  motor_weakness:
    type: atomic
    category: neurologic_finding
    definition: Decreased muscle strength.
    positive_indicators:
      - motor weakness
      - decreased strength
    severity_signals:
      major:
        - 3/5
        - 2/5
        - profound weakness
        - paralysis

  sensory_deficit:
    type: atomic
    category: neurologic_finding
    definition: Decreased or absent sensation.
    positive_indicators:
      - decreased sensation
      - numbness
      - sensory loss

  conservative_therapy_6_weeks:
    type: atomic
    category: treatment_history
    definition: At least six weeks of conservative, non-operative therapy.
    therapy_indicators:
      - physical therapy
      - NSAIDs
      - NSAID therapy
      - analgesics
      - muscle relaxants
    duration_indicators:
      - six weeks
      - 6 weeks
      - more than one month

  conservative_therapy_4_weeks:
    type: atomic
    category: treatment_history
    definition: At least four weeks of conservative therapy.
    duration_indicators:
      - four weeks
      - 4 weeks
      - one month

  symptoms_over_6_weeks:
    type: atomic
    category: symptom_duration
    definition: Symptoms present longer than six weeks.
    duration_indicators:
      - more than six weeks
      - over six weeks
      - symptoms for two months

  acute_low_back_pain:
    type: atomic
    category: condition
    positive_indicators:
      - acute low back pain
      - recent onset back pain

  osteoporosis_risk:
    type: atomic
    category: risk_factor
    definition: Risk factors for osteoporotic fracture.
    positive_indicators:
      - osteoporosis
      - osteopenia
      - chronic steroid use
      - fragility fracture history
      - low bone density

  no_red_flags:
    type: derived
    category: policy_state
    definition: Absence of red flag clinical indicators.
    exclusion_concepts:
      - spinal_fracture
      - spinal_malignancy
      - spinal_infection
      - cauda_equina_syndrome
      - rapid_neurologic_decline
      - motor_weakness
