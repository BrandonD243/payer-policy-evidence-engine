exclusion_clauses:

  - id: HUMANA_72148_E01
    name: Imaging for acute low back pain without red flags
    evidence_category: ordering_rationale
    policy_text: >
      Imaging for acute low back pain within six weeks of symptom onset
      is excluded in the absence of red flags.
    required_concepts:
      - acute_low_back_pain
      - no_red_flags